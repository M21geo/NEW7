name: Build APK

on:
  workflow_dispatch:          # زر "Run workflow" من تبويب Actions

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: |
          python --version
          pip install "flet[all]>=1.0.5,<1.1"
          pip install "flet-local-auth>=1.0.5,<1.1"
          pip install flet-notifications==0.1.4
          pip list | grep -i flet

      # مفتاح توقيع ثابت: هو الشرط لأن أندرويد يقبل التحديث فوق النسخة المنصّبة بدون مسح البيانات.
      # (يُكتب خارج مجلد التطبيق حتى لا ينحط داخل الـAPK). لا تغيّر هذا المفتاح أبداً بعد أول تنصيب.
      - name: Write signing key
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/masarif-release.jks"
        env:
          KEYSTORE_B64: 

      # رقم البناء يزيد تلقائياً مع كل تشغيل (أندرويد يرفض نسخة برقم أقل).
      # خطوة 1: flet يجهّز مشروع Flutter. ملاحظة: gradle داخله يفشل هنا بقصد (مكتبة الإشعارات تحتاج desugaring
      # والـpatch ما انحط بعد)، فنكمل بعدها يدوياً. نتأكد فقط إن مجلد المشروع انولد.
      - name: Generate Flutter project (flet)
        run: |
          flet build apk -v --yes \
            --python-version 3.12 \
            --build-number ${{ github.run_number }} \
            --android-signing-key-store "$RUNNER_TEMP/masarif-release.jks" \
            --android-signing-key-store-password fac15b69a362c897f997 \
            --android-signing-key-password fac15b69a362c897f997 \
            --android-signing-key-alias masarif || echo "flet build stopped (expected, patching next)"
          test -d build/flutter/android || { echo "::error::Flutter project was not generated"; exit 1; }

      # خطوة 2: إضافة مستقبلات الإشعارات + desugaring، ثم تجميع الـAPK بـgradle وتوقيعه بنفس المفتاح الثابت.
      # المتغيرات نفسها اللي يمررها flet لـgradle (بدونها serious_python يفشل: SITE_PACKAGES غير موجود).
      - name: Patch notifications, build and sign
        timeout-minutes: 30
        env:
          SERIOUS_PYTHON_VERSION: "3.12"
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
          SERIOUS_PYTHON_APP: ${{ github.workspace }}/build/python-app
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/masarif-release.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: fac15b69a362c897f997
          FLET_ANDROID_SIGNING_KEY_PASSWORD: fac15b69a362c897f997
          FLET_ANDROID_SIGNING_KEY_ALIAS: masarif
        run: |
          set -e
          flet-notifications-patch --project-root build/flutter
          cd build/flutter/android
          ./gradlew assembleRelease --no-daemon -Ptarget-platform=android-arm64,android-arm,android-x64
          cd ../../..
          APK=$(find build/flutter -path "*outputs/apk/release/*.apk" -printf "%s %p\n" | sort -rn | head -1 | cut -d" " -f2-)
          echo "built: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/masarif-release.jks" --ks-key-alias masarif \
            --ks-pass pass:fac15b69a362c897f997 --key-pass pass:fac15b69a362c897f997 \
            --out "$RUNNER_TEMP/masarif-notif.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/masarif-notif.apk" | head -3
          mkdir -p out && cp "$RUNNER_TEMP/masarif-notif.apk" out/masarif.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: masarif-apk
          path: out/masarif.apk
